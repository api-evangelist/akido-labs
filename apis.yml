name: Akido Labs
description: >-
  Akido Labs is a Los Angeles-based healthcare technology company re-engineering
  care delivery with artificial intelligence. Its flagship system, Scope AI, is a
  clinical decision support platform trained on large volumes of healthcare data
  using reinforcement learning with human feedback (RLHF) to help physicians reach
  efficient diagnoses, order the right diagnostics, personalize treatment, and
  forecast health risks. Providers use Scope AI through the Akido Chart EMR to
  expand capacity for primary care and specialty visits. Akido also operates Akido
  Medical, a care network spanning dozens of locations and hundreds of providers
  serving hundreds of thousands of patients, with an emphasis on underserved and
  street-medicine populations. The company is venture-backed (including a Series B
  led by Oak HC/FT) and does not currently publish a public developer API surface.
